topic: "Spring Boot/Actuator"
cards:
  - front: "What does the /actuator/health endpoint return by default, and how do you show full details?"
    back: |
      By default it returns a simple {"status":"UP"} response. To show component-level details,
      set management.endpoint.health.show-details=always (or when-authorized for authenticated users).
      Each HealthIndicator contributes its own status which is aggregated by a StatusAggregator.
    code_snippet: |
      // application.properties
      management.endpoint.health.show-details=always
      management.endpoint.health.show-components=always
    difficulty: EASY
    tags: [spring-boot, actuator, health-check]

  - front: "How do you create a custom HealthIndicator in Spring Boot?"
    back: |
      Implement the HealthIndicator interface and return Health.up() or Health.down() with optional
      details. Register it as a Spring bean. The name prefix before "HealthIndicator" becomes the
      component key in the health response.
    code_snippet: |
      @Component
      public class CacheHealthIndicator implements HealthIndicator {
          @Override
          public Health health() {
              if (cacheService.isReachable()) {
                  return Health.up()
                      .withDetail("hitRate", cacheService.getHitRate())
                      .build();
              }
              return Health.down()
                  .withDetail("error", "Cache unreachable")
                  .build();
          }
      }
    difficulty: MEDIUM
    tags: [spring-boot, health-indicator, custom-component]

  - front: "How does Spring Boot integrate with Prometheus for metrics collection?"
    back: |
      Add micrometer-registry-prometheus dependency. Spring Boot auto-configures a
      PrometheusMeterRegistry and exposes a /actuator/prometheus endpoint in Prometheus
      text format. Prometheus scrapes this endpoint at configured intervals. All Micrometer
      meters (timers, counters, gauges) are automatically exported.
    code_snippet: |
      // build.gradle
      implementation 'io.micrometer:micrometer-registry-prometheus'

      // application.properties
      management.endpoints.web.exposure.include=prometheus,health
      management.prometheus.metrics.export.enabled=true
    difficulty: MEDIUM
    tags: [micrometer, prometheus, monitoring]

  - front: "How do you register a custom metric using Micrometer in Spring Boot?"
    back: |
      Inject MeterRegistry and use its factory methods (counter, gauge, timer). Timers measure
      latency, counters track monotonically increasing values, gauges track current values.
      Use tags for dimensional filtering in dashboards.
    code_snippet: |
      @Service
      public class OrderService {
          private final Counter orderCounter;
          private final Timer processTimer;

          public OrderService(MeterRegistry registry) {
              this.orderCounter = registry.counter("orders.placed", "region", "eu");
              this.processTimer = registry.timer("orders.process.duration");
          }

          public void placeOrder(Order order) {
              processTimer.record(() -> {
                  // process order
                  orderCounter.increment();
              });
          }
      }
    difficulty: MEDIUM
    tags: [micrometer, custom-metrics, observability]

  - front: "How do you secure actuator endpoints in a Spring Boot application?"
    back: |
      Use Spring Security to restrict access. Expose only needed endpoints via
      management.endpoints.web.exposure.include. Optionally run actuator on a separate
      management port (management.server.port) isolated from public traffic. Apply role-based
      access via HttpSecurity requestMatchers for the actuator base path.
    code_snippet: |
      @Bean
      public SecurityFilterChain actuatorSecurity(HttpSecurity http) throws Exception {
          return http
              .securityMatcher(EndpointRequest.toAnyEndpoint())
              .authorizeHttpRequests(auth -> auth
                  .requestMatchers(EndpointRequest.to("health", "info")).permitAll()
                  .anyRequest().hasRole("ADMIN"))
              .httpBasic(Customizer.withDefaults())
              .build();
      }
    difficulty: HARD
    tags: [spring-security, actuator, production-hardening]

  - front: "How do you customize the /actuator/info endpoint with build and git metadata?"
    back: |
      Spring Boot auto-populates info from META-INF/build-info.properties (generated by
      spring-boot-maven-plugin's build-info goal) and git.properties (from git-commit-id-plugin).
      Custom properties under info.* in application.properties also appear. Enable the endpoint
      with management.info.env.enabled=true for environment contributions.
    code_snippet: |
      // application.properties
      info.app.name=@project.name@
      info.app.version=@project.version@
      management.info.env.enabled=true
      management.info.git.mode=full
    difficulty: EASY
    tags: [actuator, info-endpoint, build-metadata]
