topic: "DSA/Arrays"
challenges:
  - title: "Two Sum"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an array of integers `nums` and an integer `target`, return the indices of the two numbers that add up to `target`.

      You may assume that each input would have exactly one solution, and you may not use the same element twice.

      You can return the answer in any order.

      **Constraints:**
      - 2 <= nums.length <= 10^4
      - -10^9 <= nums[i] <= 10^9
      - Only one valid answer exists.
    starter_code: |
      public class Solution {
          public int[] twoSum(int[] nums, int target) {
              // Your solution here
              return new int[]{};
          }
      }
    test_cases:
      - input: "nums = [2,7,11,15], target = 9"
        expected: "[0,1]"
        description: "Basic case: 2 + 7 = 9"
      - input: "nums = [3,2,4], target = 6"
        expected: "[1,2]"
        description: "Non-adjacent elements: 2 + 4 = 6"
      - input: "nums = [3,3], target = 6"
        expected: "[0,1]"
        description: "Duplicate values: 3 + 3 = 6"
      - input: "nums = [-1,-2,-3,-4,-5], target = -8"
        expected: "[2,4]"
        description: "Negative numbers: -3 + -5 = -8"
    hints:
      - "A brute force approach checks every pair in O(n^2). Can you do better?"
      - "Use a HashMap to store each number's index as you iterate. For each number, check if (target - num) exists in the map."
      - "The optimal solution runs in O(n) time and O(n) space using a single pass with a HashMap."

  - title: "Maximum Subarray (Kadane's Algorithm)"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an integer array `nums`, find the subarray with the largest sum, and return its sum.

      A subarray is a contiguous non-empty sequence of elements within an array.

      **Constraints:**
      - 1 <= nums.length <= 10^5
      - -10^4 <= nums[i] <= 10^4

      **Follow up:** If you have figured out the O(n) solution, try coding another solution using the divide and conquer approach.
    starter_code: |
      public class Solution {
          public int maxSubArray(int[] nums) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "nums = [-2,1,-3,4,-1,2,1,-5,4]"
        expected: "6"
        description: "Subarray [4,-1,2,1] has the largest sum = 6"
      - input: "nums = [1]"
        expected: "1"
        description: "Single element array"
      - input: "nums = [5,4,-1,7,8]"
        expected: "23"
        description: "Entire array is the max subarray"
      - input: "nums = [-1,-2,-3,-4]"
        expected: "-1"
        description: "All negative: pick the least negative"
    hints:
      - "At each position, decide: start a new subarray here, or extend the previous subarray?"
      - "Kadane's Algorithm: currentMax = max(nums[i], currentMax + nums[i]). Track the global maximum across all positions."
      - "If currentMax becomes negative, it's better to start fresh from the next element."

  - title: "Merge Two Sorted Arrays"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      You are given two integer arrays `nums1` and `nums2`, sorted in non-decreasing order, and two integers `m` and `n`, representing the number of elements in `nums1` and `nums2` respectively.

      Merge `nums2` into `nums1` as one sorted array **in-place**. The final sorted array should be stored inside `nums1`. To accommodate this, `nums1` has a length of `m + n`, where the last `n` elements are set to 0 and should be ignored.

      **Constraints:**
      - nums1.length == m + n
      - nums2.length == n
      - 0 <= m, n <= 200
      - -10^9 <= nums1[i], nums2[j] <= 10^9
    starter_code: |
      public class Solution {
          public void merge(int[] nums1, int m, int[] nums2, int n) {
              // Your solution here - modify nums1 in-place
          }
      }
    test_cases:
      - input: "nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3"
        expected: "[1,2,2,3,5,6]"
        description: "Standard merge of two sorted arrays"
      - input: "nums1 = [1], m = 1, nums2 = [], n = 0"
        expected: "[1]"
        description: "Empty second array"
      - input: "nums1 = [0], m = 0, nums2 = [1], n = 1"
        expected: "[1]"
        description: "Empty first array"
      - input: "nums1 = [4,5,6,0,0,0], m = 3, nums2 = [1,2,3], n = 3"
        expected: "[1,2,3,4,5,6]"
        description: "All of nums2 comes before nums1"
    hints:
      - "Start from the end of both arrays. The back of nums1 has empty space."
      - "Use three pointers: p1 at m-1, p2 at n-1, and write pointer at m+n-1. Compare and place the larger element at the write position, moving backwards."
      - "This avoids shifting elements and achieves O(m+n) time with O(1) extra space."

  - title: "Rotate Array"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an integer array `nums`, rotate the array to the right by `k` steps, where `k` is non-negative.

      **Constraints:**
      - 1 <= nums.length <= 10^5
      - -2^31 <= nums[i] <= 2^31 - 1
      - 0 <= k <= 10^5

      **Follow up:** Try to come up with as many solutions as you can. Could you do it in-place with O(1) extra space?
    starter_code: |
      public class Solution {
          public void rotate(int[] nums, int k) {
              // Your solution here - modify nums in-place
          }
      }
    test_cases:
      - input: "nums = [1,2,3,4,5,6,7], k = 3"
        expected: "[5,6,7,1,2,3,4]"
        description: "Rotate right by 3: last 3 elements move to front"
      - input: "nums = [-1,-100,3,99], k = 2"
        expected: "[3,99,-1,-100]"
        description: "Rotate right by 2"
      - input: "nums = [1,2,3,4,5,6,7], k = 7"
        expected: "[1,2,3,4,5,6,7]"
        description: "k equals array length: no change"
      - input: "nums = [1,2], k = 3"
        expected: "[2,1]"
        description: "k > array length: k % n effective rotations"
    hints:
      - "Handle k > nums.length by taking k = k % nums.length."
      - "The reverse approach: reverse entire array, then reverse first k elements, then reverse remaining n-k elements."
      - "Example: [1,2,3,4,5,6,7] k=3 → reverse all: [7,6,5,4,3,2,1] → reverse first 3: [5,6,7,4,3,2,1] → reverse last 4: [5,6,7,1,2,3,4]"

  - title: "Contains Duplicate"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 180
    problem_statement: |
      Given an integer array `nums`, return `true` if any value appears at least twice in the array, and return `false` if every element is distinct.

      **Constraints:**
      - 1 <= nums.length <= 10^5
      - -10^9 <= nums[i] <= 10^9
    starter_code: |
      public class Solution {
          public boolean containsDuplicate(int[] nums) {
              // Your solution here
              return false;
          }
      }
    test_cases:
      - input: "nums = [1,2,3,1]"
        expected: "true"
        description: "1 appears twice"
      - input: "nums = [1,2,3,4]"
        expected: "false"
        description: "All distinct elements"
      - input: "nums = [1,1,1,3,3,4,3,2,4,2]"
        expected: "true"
        description: "Multiple duplicates"
      - input: "nums = [0]"
        expected: "false"
        description: "Single element: no duplicates possible"
    hints:
      - "Sorting the array groups duplicates together - check adjacent elements. O(n log n) time."
      - "A HashSet gives O(n) time: add each element; if add() returns false, a duplicate exists."
      - "Space-time tradeoff: O(1) space with sort vs O(n) space with HashSet."
