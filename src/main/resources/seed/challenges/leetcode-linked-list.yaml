  - title: "LRU Cache"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      Design a data structure that implements a Least Recently Used (LRU) cache.

      Implement the `LRUCache` class:
      - `LRUCache(int capacity)` - Initialize the cache with a positive capacity.
      - `int get(int key)` - Return the value associated with the key if it exists, otherwise return -1. This operation marks the key as recently used.
      - `void put(int key, int value)` - Update the value of the key if it exists, or insert the key-value pair. If inserting causes the cache to exceed its capacity, evict the least recently used key before inserting the new one.

      Both `get` and `put` must run in O(1) average time complexity.

      **Constraints:**
      - 1 <= capacity <= 3000
      - 0 <= key <= 10^4
      - 0 <= value <= 10^5
      - At most 2 * 10^5 calls will be made to get and put.
    starter_code: |
      public class Solution {
          class LRUCache {
              public LRUCache(int capacity) {
                  // Initialize your data structure here
              }

              public int get(int key) {
                  // Your solution here
                  return -1;
              }

              public void put(int key, int value) {
                  // Your solution here
              }
          }
      }
    test_cases:
      - input: "LRUCache(2), put(1,1), put(2,2), get(1), put(3,3), get(2), put(4,4), get(1), get(3), get(4)"
        expected: "get(1)=1, get(2)=-1, get(1)=-1, get(3)=3, get(4)=4"
        description: "Standard LRU eviction sequence"
      - input: "LRUCache(1), put(2,1), get(2), put(3,2), get(2), get(3)"
        expected: "get(2)=1, get(2)=-1, get(3)=2"
        description: "Capacity 1 evicts on every new put"
      - input: "LRUCache(2), put(1,1), put(2,2), put(1,10), get(1), get(2)"
        expected: "get(1)=10, get(2)=2"
        description: "Update existing key does not evict"
      - input: "LRUCache(2), put(1,1), put(2,2), get(1), put(3,3), get(2)"
        expected: "get(1)=1, get(2)=-1"
        description: "get refreshes usage order, so key 2 is evicted instead of 1"
    hints:
      - "What combination of data structures gives you O(1) lookup AND O(1) insertion/removal by position?"
      - "Use a HashMap for O(1) key lookup and a doubly linked list to maintain access order. Most recently used goes to the front, least recently used is at the back."
      - "On get: look up node in map, move it to the front of the list. On put: if key exists, update value and move to front. If new, add to front and map. If over capacity, remove the tail node from both the list and the map."
