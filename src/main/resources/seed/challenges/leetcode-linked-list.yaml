topic: "DSA/LinkedLists"
challenges:
  - title: "Linked List Cycle"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given the `head` of a singly linked list, determine whether the list contains a cycle.

      A cycle exists if some node in the list can be reached again by continuously following the `next` pointer. Internally, a cycle is formed when a node's `next` pointer connects back to a previously visited node.

      Return `true` if there is a cycle in the linked list, otherwise return `false`.

      **Constraints:**
      - The number of nodes in the list is in the range [0, 10^4].
      - -10^5 <= Node.val <= 10^5
      - The solution should use O(1) extra memory.
    starter_code: |
      public class Solution {
          public boolean hasCycle(ListNode head) {
              // Your solution here
              return false;
          }
      }
    test_cases:
      - input: "head = [3,2,0,-4], cycle at index 1"
        expected: "true"
        description: "Tail connects back to second node forming a cycle"
      - input: "head = [1,2], cycle at index 0"
        expected: "true"
        description: "Tail connects back to head"
      - input: "head = [1], no cycle"
        expected: "false"
        description: "Single node with no cycle"
      - input: "head = [], no cycle"
        expected: "false"
        description: "Empty list has no cycle"
    hints:
      - "Think about what happens if two people walk at different speeds on a circular track."
      - "Use two pointers moving at different speeds. If there is a cycle, the fast pointer will eventually meet the slow pointer."
      - "Initialize slow and fast to head. Move slow by 1 step and fast by 2 steps each iteration. If they meet, a cycle exists. If fast reaches null, no cycle."

  - title: "Add Two Numbers"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      You are given two non-empty linked lists representing two non-negative integers. The digits are stored in reverse order, meaning the ones digit is at the head of the list. Each node contains a single digit.

      Add the two numbers and return the sum as a linked list in the same reversed format.

      You may assume the two numbers do not contain any leading zeros, except the number 0 itself.

      **Constraints:**
      - The number of nodes in each linked list is in the range [1, 100].
      - 0 <= Node.val <= 9
      - The numbers represented by the lists do not have leading zeros.
    starter_code: |
      public class Solution {
          public ListNode addTwoNumbers(ListNode l1, ListNode l2) {
              // Your solution here
              return null;
          }
      }
    test_cases:
      - input: "l1 = [2,4,3], l2 = [5,6,4]"
        expected: "[7,0,8]"
        description: "342 + 465 = 807"
      - input: "l1 = [0], l2 = [0]"
        expected: "[0]"
        description: "0 + 0 = 0"
      - input: "l1 = [9,9,9,9,9,9,9], l2 = [9,9,9,9]"
        expected: "[8,9,9,9,0,0,0,1]"
        description: "Lists of different lengths with carry propagation"
      - input: "l1 = [5], l2 = [5]"
        expected: "[0,1]"
        description: "Single digits that produce a carry"
    hints:
      - "Simulate the addition process digit by digit, just like you would on paper."
      - "Traverse both lists simultaneously, summing corresponding digits along with any carry from the previous step."
      - "Use a dummy head node to simplify list construction. At each step compute sum = l1.val + l2.val + carry, create a node with sum % 10, and update carry = sum / 10. Don't forget a final node if carry remains."

