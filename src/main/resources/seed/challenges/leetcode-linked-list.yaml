  - title: "Copy List with Random Pointer"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      A linked list of length `n` is given where each node contains an additional `random` pointer that can point to any node in the list or `null`.

      Construct a deep copy of the list. The deep copy should consist of exactly `n` brand new nodes, where each new node has its value set to the value of its corresponding original node. Both the `next` and `random` pointers of the new nodes should point to new nodes in the copied list such that the pointers in the original and copied lists represent the same list state.

      Return the head of the copied linked list.

      **Constraints:**
      - 0 <= n <= 1000
      - -10^4 <= Node.val <= 10^4
      - `random` is null or points to some node in the linked list.
    starter_code: |
      public class Solution {
          public Node copyRandomList(Node head) {
              // Your solution here
              return null;
          }
      }
    test_cases:
      - input: "head = [[7,null],[13,0],[11,4],[10,2],[1,0]]"
        expected: "[[7,null],[13,0],[11,4],[10,2],[1,0]]"
        description: "List with various random pointers including null"
      - input: "head = [[1,1],[2,1]]"
        expected: "[[1,1],[2,1]]"
        description: "Random pointers forming a small pattern"
      - input: "head = [[3,null],[3,0],[3,null]]"
