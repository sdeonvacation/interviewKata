          }
      }
    test_cases:
      - input: "head = [1,2,3,4,5], k = 2"
        expected: "[4,5,1,2,3]"
        description: "Rotate right by 2 positions"
      - input: "head = [0,1,2], k = 4"
        expected: "[2,0,1]"
        description: "k larger than list length, use modulo"
      - input: "head = [1], k = 99"
        expected: "[1]"
        description: "Single node, rotation has no effect"
      - input: "head = [1,2,3], k = 3"
        expected: "[1,2,3]"
        description: "k equals list length, list unchanged"
    hints:
      - "If k is larger than the list length, the effective rotation is k % length."
      - "Find the length and connect the tail to head forming a circle. Then find the new tail position and break the circle there."
      - "Compute length n, set k = k % n. If k is 0, return head. Connect tail.next = head (circular). Move (n - k) steps from the old tail to find the new tail. New head is newTail.next. Set newTail.next = null."

