  - title: "Reverse Nodes in k-Group"
    difficulty: HARD
    type: DSA
    time_limit_seconds: 900
    problem_statement: |
      Given the `head` of a linked list, reverse the nodes of the list `k` at a time, and return the modified list.

      `k` is a positive integer and is less than or equal to the length of the linked list. If the number of nodes remaining is fewer than `k`, leave them as-is.

      You may not alter the values in the list's nodes; only the nodes themselves may be rearranged.

      **Constraints:**
      - The number of nodes in the list is n.
      - 1 <= k <= n <= 5000
      - 0 <= Node.val <= 1000
    starter_code: |
      public class Solution {
          public ListNode reverseKGroup(ListNode head, int k) {
              // Your solution here
              return null;
          }
      }
    test_cases:
      - input: "head = [1,2,3,4,5], k = 2"
        expected: "[2,1,4,3,5]"
        description: "Groups of 2 reversed, last single node remains"
      - input: "head = [1,2,3,4,5], k = 3"
        expected: "[3,2,1,4,5]"
        description: "First group of 3 reversed, remaining 2 stay"
      - input: "head = [1,2,3,4,5,6], k = 3"
        expected: "[3,2,1,6,5,4]"
        description: "Two full groups of 3 both reversed"
      - input: "head = [1,2,3,4,5], k = 1"
        expected: "[1,2,3,4,5]"
        description: "k=1 means no reversal needed"
    hints:
      - "Break the problem into subproblems: first check if there are k nodes remaining, then reverse those k nodes."
      - "Count k nodes ahead. If fewer than k remain, stop. Otherwise reverse the next k nodes and recursively process the rest."
      - "Iterative approach: use a dummy head, maintain a pointer to the group start. For each group, reverse k nodes in place, then connect the previous group's tail to the new head. Track the tail of the reversed group for connecting the next segment."

