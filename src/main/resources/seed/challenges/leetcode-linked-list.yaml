  - title: "Remove Duplicates from Sorted List II"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      Given the `head` of a sorted linked list, delete all nodes that have duplicate numbers, leaving only distinct numbers from the original list. Return the linked list sorted as well.

      Note: this removes ALL occurrences of duplicated values, not just the extras.

      **Constraints:**
      - The number of nodes in the list is in the range [0, 300].
      - -100 <= Node.val <= 100
      - The list is guaranteed to be sorted in ascending order.
    starter_code: |
      public class Solution {
          public ListNode deleteDuplicates(ListNode head) {
              // Your solution here
              return null;
          }
      }
    test_cases:
      - input: "head = [1,2,3,3,4,4,5]"
        expected: "[1,2,5]"
        description: "Remove nodes with values 3 and 4 entirely"
      - input: "head = [1,1,1,2,3]"
        expected: "[2,3]"
        description: "Remove duplicates at the beginning"
      - input: "head = [1,1,2,2,3,3]"
        expected: "[]"
        description: "All nodes are duplicates, empty result"
      - input: "head = [1,2,3,4,5]"
        expected: "[1,2,3,4,5]"
        description: "No duplicates, list unchanged"
    hints:
      - "Since the list is sorted, duplicates are always adjacent. How can you skip over all nodes with the same value?"
      - "Use a dummy node and a predecessor pointer. When you detect duplicates, skip all nodes with that value. Otherwise, advance the predecessor."
      - "Set pred.next to point past all duplicate nodes. While current and current.next have the same value, advance current. Then set pred.next = current.next to skip all copies. If no duplicate was found, simply advance pred."

  - title: "Rotate List"
    difficulty: MEDIUM
