      }
    test_cases:
      - input: "list1 = [1,2,4], list2 = [1,3,4]"
        expected: "[1,1,2,3,4,4]"
        description: "Two lists of equal length merged in order"
      - input: "list1 = [], list2 = []"
        expected: "[]"
        description: "Both lists empty"
      - input: "list1 = [], list2 = [0]"
