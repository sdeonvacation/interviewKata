  - title: "Majority Element"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an array `nums` of size `n`, find the majority element. The majority element is the element that appears more than `n / 2` times. You may assume that the majority element always exists in the array.

      Try to solve it in O(n) time and O(1) space.

      **Constraints:**
      - n == nums.length
      - 1 <= n <= 5 * 10^4
      - -10^9 <= nums[i] <= 10^9
      - The majority element is guaranteed to exist.
    starter_code: |
      public class Solution {
          public int majorityElement(int[] nums) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "nums = [3,2,3]"
        expected: "3"
        description: "Simple majority element"
      - input: "nums = [2,2,1,1,1,2,2]"
        expected: "2"
        description: "Majority element interleaved with others"
      - input: "nums = [1]"
        expected: "1"
        description: "Single element array"
      - input: "nums = [6,6,6,7,7]"
        expected: "6"
        description: "Majority by one occurrence"
    hints:
      - "There is a well-known voting algorithm that solves this in O(1) space."
      - "Boyer-Moore Voting Algorithm: maintain a candidate and a counter. Increment when you see the candidate, decrement otherwise. When counter hits 0, pick a new candidate."
      - "The candidate surviving at the end is guaranteed to be the majority element since it appears more than n/2 times."

  - title: "Rotate Array"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      Given an integer array `nums`, rotate the array to the right by `k` steps. Each step moves the last element to the front.

      Perform the rotation in-place with O(1) extra space.

      **Constraints:**
      - 1 <= nums.length <= 10^5
      - -2^31 <= nums[i] <= 2^31 - 1
      - 0 <= k <= 10^5
    starter_code: |
      public class Solution {
          public void rotate(int[] nums, int k) {
              // Your solution here
          }
      }
    test_cases:
      - input: "nums = [1,2,3,4,5,6,7], k = 3"
        expected: "[5,6,7,1,2,3,4]"
        description: "Standard rotation by 3"
      - input: "nums = [-1,-100,3,99], k = 2"
        expected: "[3,99,-1,-100]"
        description: "Rotation with negative numbers"
      - input: "nums = [1,2,3], k = 4"
        expected: "[3,1,2]"
        description: "k larger than array length"
      - input: "nums = [1], k = 0"
        expected: "[1]"
        description: "No rotation needed"
    hints:
      - "What happens if k is greater than the array length? Think modulo."
      - "Consider the reversal approach: reverse the entire array, then reverse the first k elements, then reverse the rest."
      - "After k = k % n: reverse(0, n-1), reverse(0, k-1), reverse(k, n-1) gives the desired rotation."

  - title: "Best Time to Buy and Sell Stock"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      You are given an array `prices` where `prices[i]` is the price of a stock on the i-th day. You want to maximize profit by choosing a single day to buy and a different later day to sell.

      Return the maximum profit achievable from this single transaction. If no profit is possible, return 0.

      **Constraints:**
      - 1 <= prices.length <= 10^5
      - 0 <= prices[i] <= 10^4
    starter_code: |
      public class Solution {
          public int maxProfit(int[] prices) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "prices = [7,1,5,3,6,4]"
        expected: "5"
        description: "Buy at 1, sell at 6"
      - input: "prices = [7,6,4,3,1]"
        expected: "0"
        description: "Prices only decrease, no profit possible"
      - input: "prices = [2,4,1]"
        expected: "2"
        description: "Best profit is early buy-sell, not later"
      - input: "prices = [1,2]"
        expected: "1"
        description: "Minimum profitable case"
    hints:
      - "Track the minimum price seen so far as you iterate."
      - "At each day, calculate the profit if you sold today (current price minus minimum so far). Track the maximum of these profits."
      - "One pass: maintain minPrice and maxProfit. For each price, update minPrice = min(minPrice, price) and maxProfit = max(maxProfit, price - minPrice)."

