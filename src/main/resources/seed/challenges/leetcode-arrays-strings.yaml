  - title: "Jump Game"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      You are given an integer array `nums` where each element represents the maximum jump length from that position. Starting at the first index, determine if you can reach the last index.

      Return `true` if you can reach the last index, `false` otherwise.

      **Constraints:**
      - 1 <= nums.length <= 10^4
      - 0 <= nums[i] <= 10^5
    starter_code: |
      public class Solution {
          public boolean canJump(int[] nums) {
              // Your solution here
              return false;
          }
      }
    test_cases:
      - input: "nums = [2,3,1,1,4]"
        expected: "true"
        description: "Can reach end via multiple paths"
      - input: "nums = [3,2,1,0,4]"
        expected: "false"
        description: "Stuck at index 3 with value 0"
      - input: "nums = [0]"
        expected: "true"
        description: "Already at last index"
      - input: "nums = [2,0,0]"
        expected: "true"
        description: "Can jump directly to end"
    hints:
      - "Think greedily: track the farthest index you can reach."
      - "Iterate through the array. At each position, update the farthest reachable index. If you ever find yourself at a position beyond farthest, you're stuck."
      - "Maintain maxReach = 0. For each i, if i > maxReach return false. Update maxReach = max(maxReach, i + nums[i]). If maxReach >= last index, return true."

