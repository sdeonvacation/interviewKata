  - title: "H-Index"
    difficulty: MEDIUM
    type: DSA
    time_limit_seconds: 600
    problem_statement: |
      Given an array of integers `citations` where `citations[i]` is the number of citations a researcher's i-th paper received, compute the researcher's h-index.

      The h-index is defined as the maximum value `h` such that the researcher has at least `h` papers with at least `h` citations each.

      **Constraints:**
      - n == citations.length
      - 1 <= n <= 5000
      - 0 <= citations[i] <= 1000
    starter_code: |
      public class Solution {
          public int hIndex(int[] citations) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "citations = [3,0,6,1,5]"
        expected: "3"
        description: "3 papers with at least 3 citations"
      - input: "citations = [1,3,1]"
        expected: "1"
        description: "Only 1 paper with at least 1 citation qualifies"
      - input: "citations = [0]"
        expected: "0"
        description: "No citations at all"
      - input: "citations = [100]"
        expected: "1"
        description: "One highly cited paper, h-index is 1"
    hints:
      - "Sorting the citations array makes it easier to check the h-index condition."
      - "After sorting in descending order, the h-index is the largest i+1 where citations[i] >= i+1."
      - "Alternatively, use a counting sort bucket approach: create buckets[0..n]. For each citation c, increment buckets[min(c, n)]. Then iterate from n down, accumulating counts until count >= h."

