    test_cases:
      - input: "nums = [1,1,1,2,2,3]"
        expected: "5"
        description: "Triple reduced to double, result: [1,1,2,2,3]"
      - input: "nums = [0,0,1,1,1,1,2,3,3]"
        expected: "7"
        description: "Multiple elements with excess duplicates"
      - input: "nums = [1,1]"
