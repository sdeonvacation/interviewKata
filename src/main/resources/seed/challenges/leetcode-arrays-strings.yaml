topic: "DSA/Arrays"
challenges:
  - title: "Merge Sorted Array"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      You are given two integer arrays `nums1` and `nums2`, sorted in non-decreasing order. You are also given an integer `m` representing the number of valid elements in `nums1`, and an integer `n` representing the number of elements in `nums2`.

      Merge `nums2` into `nums1` so that the resulting array is sorted in non-decreasing order. The final result should be stored inside `nums1`. To accommodate this, `nums1` has a total length of `m + n`, where the last `n` elements are set to 0 and should be ignored during the merge.

      **Constraints:**
      - nums1.length == m + n
      - nums2.length == n
      - 0 <= m, n <= 200
      - 1 <= m + n <= 200
      - -10^9 <= nums1[i], nums2[j] <= 10^9
    starter_code: |
      public class Solution {
          public void merge(int[] nums1, int m, int[] nums2, int n) {
              // Your solution here
          }
      }
    test_cases:
      - input: "nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3"
        expected: "[1,2,2,3,5,6]"
        description: "Standard merge of two sorted arrays"
      - input: "nums1 = [1], m = 1, nums2 = [], n = 0"
        expected: "[1]"
        description: "Empty second array"
      - input: "nums1 = [0], m = 0, nums2 = [1], n = 1"
        expected: "[1]"
        description: "Empty first array"
      - input: "nums1 = [4,5,6,0,0,0], m = 3, nums2 = [1,2,3], n = 3"
        expected: "[1,2,3,4,5,6]"
        description: "All elements of nums2 are smaller"
    hints:
      - "Think about filling the array from the end rather than the beginning."
      - "Use three pointers: one at the end of valid nums1, one at the end of nums2, and one at the very end of nums1."
      - "Compare elements from the back of both arrays and place the larger one at the current write position, moving backwards."

  - title: "Remove Element"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an integer array `nums` and an integer `val`, remove all occurrences of `val` in `nums` in-place. The order of the remaining elements may be changed. Return the number of elements in `nums` which are not equal to `val`.

      After returning `k` (the count of elements not equal to `val`), the first `k` elements of `nums` should contain only elements that are not equal to `val`. The remaining elements beyond index `k` do not matter.

      **Constraints:**
      - 0 <= nums.length <= 100
      - 0 <= nums[i] <= 50
      - 0 <= val <= 100
    starter_code: |
      public class Solution {
          public int removeElement(int[] nums, int val) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "nums = [3,2,2,3], val = 3"
        expected: "2"
        description: "Remove value that appears at boundaries"
      - input: "nums = [0,1,2,2,3,0,4,2], val = 2"
        expected: "5"
        description: "Remove value appearing multiple times"
      - input: "nums = [], val = 0"
        expected: "0"
        description: "Empty array"
      - input: "nums = [1], val = 1"
        expected: "0"
        description: "Single element that matches val"
    hints:
      - "Consider using two pointers to overwrite unwanted elements."
      - "Keep a slow pointer that tracks where the next valid element should go, and a fast pointer that scans the array."
      - "When the fast pointer finds a non-val element, copy it to the slow pointer position and advance the slow pointer."

  - title: "Remove Duplicates from Sorted Array"
    difficulty: EASY
    type: DSA
    time_limit_seconds: 300
    problem_statement: |
      Given an integer array `nums` sorted in non-decreasing order, remove the duplicates in-place such that each unique element appears only once. Return the number of unique elements.

      After returning `k` (the number of unique elements), the first `k` elements of `nums` should hold the unique elements in their original order. The elements beyond index `k` do not matter.

      **Constraints:**
      - 1 <= nums.length <= 3 * 10^4
      - -100 <= nums[i] <= 100
      - nums is sorted in non-decreasing order.
    starter_code: |
      public class Solution {
          public int removeDuplicates(int[] nums) {
              // Your solution here
              return 0;
          }
      }
    test_cases:
      - input: "nums = [1,1,2]"
        expected: "2"
        description: "Simple case with one duplicate"
      - input: "nums = [0,0,1,1,1,2,2,3,3,4]"
        expected: "5"
        description: "Multiple duplicates throughout"
      - input: "nums = [1]"
        expected: "1"
        description: "Single element array"
      - input: "nums = [-3,-1,-1,0,0,0,2,2]"
