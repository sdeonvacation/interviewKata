      - "If not uniform, split the region into four equal quadrants using midpoints of row and column ranges, then recurse on each quadrant."
      - "Track the current region using row start, column start, and size parameters in your recursive function."

  - title: "Merge k Sorted Lists"
    difficulty: HARD
    type: DSA
    time_limit_seconds: 900
    problem_statement: |
      You are given an array of k linked lists, where each linked list is individually sorted
      in ascending order. Merge all k linked lists into a single sorted linked list and return
      its head.

      Constraints:
      - k == lists.length
      - 0 <= k <= 10^4
      - 0 <= lists[i].length <= 500
      - -10^4 <= lists[i][j] <= 10^4
      - Each lists[i] is sorted in ascending order
      - The total number of nodes across all lists does not exceed 10^4
    starter_code: |
      // Definition for singly-linked list:
      // class ListNode {
      //     int val;
      //     ListNode next;
      //     ListNode(int val) { this.val = val; }
      // }

      public class Solution {
          public ListNode mergeKLists(ListNode[] lists) {
              // Your solution here
          }
      }
    test_cases:
      - input: "lists = [[1,4,5],[1,3,4],[2,6]]"
        expected: "[1, 1, 2, 3, 4, 4, 5, 6]"
        description: "Three sorted lists merged into one sorted list"
      - input: "lists = []"
        expected: "[]"
        description: "Empty array of lists returns empty list"
      - input: "lists = [[]]"
        expected: "[]"
        description: "Array containing one empty list returns empty list"
      - input: "lists = [[1],[2],[3],[4],[5]]"
        expected: "[1, 2, 3, 4, 5]"
        description: "Five single-element lists merged in sorted order"
    hints:
      - "A brute force approach collects all values, sorts them, and rebuilds the list, but this doesn't leverage the pre-sorted property."
      - "Use a min-heap (PriorityQueue) to always extract the smallest current head among all k lists. Push the next node from the extracted node's list back into the heap."
      - "Alternatively, apply divide and conquer: pair up lists and merge each pair, reducing k lists to k/2, then k/4, and so on until one remains. This gives O(n log k) time."
