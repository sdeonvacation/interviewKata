              return 0;
          }
      }
    test_cases:
      - input: "s = \"abcabcbb\""
        expected: "3"
        description: "Longest is 'abc' with length 3"
      - input: "s = \"bbbbb\""
        expected: "1"
        description: "All same character: length 1"
      - input: "s = \"pwwkew\""
        expected: "3"
        description: "Longest is 'wke' with length 3 (not 'pwke' - must be contiguous)"
      - input: "s = \"\""
        expected: "0"
        description: "Empty string"
      - input: "s = \"dvdf\""
        expected: "3"
        description: "Longest is 'vdf' - sliding window must shrink from left"
    hints:
      - "Use the sliding window technique with two pointers (left and right)."
      - "Maintain a Set or Map of characters in the current window. When a duplicate is found, shrink the window from the left until the duplicate is removed."
      - "Optimization: use a HashMap<Character, Integer> storing last seen index. When duplicate found, jump left pointer to max(left, lastSeen + 1) to avoid character-by-character shrinking."
