services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewkata-db
    environment:
      POSTGRES_DB: interviewkata
      POSTGRES_USER: interviewkata
      POSTGRES_PASSWORD: interviewkata
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewkata"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
